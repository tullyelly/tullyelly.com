name: Protected credential maintenance
run-name: Credential maintenance ${{ inputs.maintenance_action }} at ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed executor SHA on protected main
        required: true
        type: string
      manifest_path:
        description: Reviewed maintenance/<name>.json; contains application SHA and targets, no secrets
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      maintenance_action:
        required: true
        type: choice
        options: [rotate, recover]
      dispatch_run_id:
        required: true
        type: string
      dispatch_installation_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Shares the production executor lock; maintenance and analytics releases cannot overlap.
concurrency:
  group: production-release-tullyelly
  cancel-in-progress: false

env:
  RELEASE_CHILD_WORKFLOW: .github/workflows/credential-maintenance.yml
  RELEASE_SHA: ${{ inputs.release_sha }}
  RELEASE_DISPATCH_RUN_ID: ${{ inputs.dispatch_run_id }}
  RELEASE_DISPATCH_INSTALLATION_ID: ${{ inputs.dispatch_installation_id }}
  RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
  RELEASE_APP_INSTALLATION_ID: ${{ vars.RELEASE_APP_INSTALLATION_ID }}
  RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
  RELEASE_APP_BOT_USER_ID: ${{ vars.RELEASE_APP_BOT_USER_ID }}
  RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  MANIFEST_SOURCE: ${{ inputs.manifest_path }}
  MAINTENANCE_ACTION: ${{ inputs.maintenance_action }}
  CI: "true"
  VERCEL_CLI_VERSION: "63.1.2"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      build_sha256: ${{ steps.bundle.outputs.sha256 }}
    env:
      APPLICATION_DIRECTORY: ${{ github.workspace }}/application
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind executor and non-secret manifest
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MANIFEST_SOURCE" =~ ^maintenance/[a-z0-9-]+\.json$ ]]
          git show "$GITHUB_SHA:$MANIFEST_SOURCE" > "$RUNNER_TEMP/maintenance-manifest.json"
          git checkout --detach "$RELEASE_SHA"
          mkdir -p maintenance
          cp "$RUNNER_TEMP/maintenance-manifest.json" "$MANIFEST_SOURCE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Install executor without production credentials
        run: npm ci
        env:
          SKIP_DB: "true"
      - name: Verify App provenance and inspect manifest
        id: manifest
        run: npx tsx scripts/credential-maintenance.ts prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate reviewed executor
        run: npm run verify:agent
        env:
          SKIP_DB: "true"
          ANALYTICS_SYNC_ENABLED: "false"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.manifest.outputs.recovery_run == ''
        with:
          ref: ${{ steps.manifest.outputs.application_sha }}
          path: application
          persist-credentials: false
      - name: Prepare credential-free application link
        if: steps.manifest.outputs.recovery_run == ''
        run: npx tsx scripts/credential-maintenance.ts prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build exact deployed application without maintenance credentials
        if: steps.manifest.outputs.recovery_run == ''
        working-directory: application
        run: |
          npm ci
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          npm run verify:agent
          vercel build --prod --standalone --non-interactive
          tar -cf "$RUNNER_TEMP/maintenance-prebuilt.tar" .vercel/output
        env:
          SKIP_DB: "true"
          ANALYTICS_SYNC_ENABLED: "false"
          NEXTAUTH_SECRET: maintenance-build-placeholder
          AUTH_SECRET: maintenance-build-placeholder
          NEXTAUTH_URL: https://tullyelly.com
          GOOGLE_CLIENT_ID: maintenance-build-placeholder
          GOOGLE_CLIENT_SECRET: maintenance-build-placeholder
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.manifest.outputs.recovery_run != ''
        with:
          name: maintenance-prebuilt-${{ steps.manifest.outputs.recovery_run }}
          run-id: ${{ steps.manifest.outputs.recovery_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Bind artifact bytes
        id: bundle
        run: |
          set -euo pipefail
          actual="$(sha256sum "$RUNNER_TEMP/maintenance-prebuilt.tar" | cut -d ' ' -f 1)"
          if [[ -n "$RECOVERY_BUILD" ]]; then [[ "$actual" == "$RECOVERY_BUILD" ]]; fi
          printf 'sha256=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          printf 'Executor `%s`; reviewed application `%s`; artifact `%s`. Approval permits only the manifest credential maintenance, with no migrations.\n' "$RELEASE_SHA" "$APPLICATION_SHA" "$actual" >> "$GITHUB_STEP_SUMMARY"
        env:
          RECOVERY_BUILD: ${{ steps.manifest.outputs.recovery_build }}
          APPLICATION_SHA: ${{ steps.manifest.outputs.application_sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-prebuilt.tar
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-manifest.json
          retention-days: 7
          if-no-files-found: error

  maintenance:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Install reviewed executor before exposing maintenance credentials
        run: |
          npm ci
          npm install --global "vercel@$VERCEL_CLI_VERSION"
        env:
          SKIP_DB: "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maintenance-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maintenance-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Verify artifact and restore credential-free project link
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SOURCE" =~ ^maintenance/[a-z0-9-]+\.json$ ]]
          [[ "$BUILD_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$BUILD_SHA256" "$RUNNER_TEMP/maintenance-prebuilt.tar" | sha256sum --check
          mkdir -p maintenance "$APPLICATION_DIRECTORY"
          cp "$RUNNER_TEMP/maintenance-manifest.json" "$MANIFEST_SOURCE"
          python3 scripts/release/maintenance-archive.py "$RUNNER_TEMP/maintenance-prebuilt.tar" "$APPLICATION_DIRECTORY"
          npx tsx scripts/credential-maintenance.ts prepare
        env:
          APPLICATION_DIRECTORY: ${{ runner.temp }}/maintenance-application
          BUILD_SHA256: ${{ needs.prepare.outputs.build_sha256 }}
          GH_TOKEN: ${{ github.token }}
      - name: Verify human approval, rotate or recover, stage and verify
        run: npx tsx scripts/credential-maintenance.ts execute
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_DIRECTORY: ${{ runner.temp }}/maintenance-application
          MAINTENANCE_BUILD_SHA256: ${{ needs.prepare.outputs.build_sha256 }}
          MAINTENANCE_PRODUCTION_APPROVED: "true"
          NEON_CREDENTIAL_MAINTENANCE_API_KEY: ${{ secrets.NEON_CREDENTIAL_MAINTENANCE_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_RELEASE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
