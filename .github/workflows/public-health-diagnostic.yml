name: Public health diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Install locked diagnostic dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compare anonymous public homepage health
        run: node --import tsx scripts/diagnose-public-health.ts
