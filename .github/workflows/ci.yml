name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_BUILD_CACHE: "1"
  DATABASE_URL: "postgresql://tullyelly_ci:tullyelly_ci@127.0.0.1:5432/tullyelly_ci"
  TEST_DATABASE_URL: "postgresql://tullyelly_ci:tullyelly_ci@127.0.0.1:5432/tullyelly_test"
  AUTH_SECRET: "ci-auth-secret"
  NEXTAUTH_SECRET: "ci-auth-secret"
  NEXTAUTH_URL: "http://127.0.0.1:4010"
  NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:4010"
  GOOGLE_CLIENT_ID: "ci-google-client-id"
  GOOGLE_CLIENT_SECRET: "ci-google-client-secret"
  NEXT_PUBLIC_MENU_SHOW_ALL: "1"

jobs:
  guardrails:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node, dependencies and lint cache
        id: setup
        uses: ./.github/actions/setup

      - name: Validate source
        env:
          SKIP_DB: "true"
        run: npm run verify:source

      - name: Upload lcov report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Cache Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-v2-${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup.outputs.node-version }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'package.json', 'next.config.*', 'tsconfig.json', 'contentlayer.config.*', 'postcss.config.*', 'tailwind.config.*', '.github/workflows/ci.yml', '.github/actions/setup/action.yml') }}-${{ github.sha }}
          restore-keys: |
            next-v2-${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup.outputs.node-version }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'package.json', 'next.config.*', 'tsconfig.json', 'contentlayer.config.*', 'postcss.config.*', 'tailwind.config.*', '.github/workflows/ci.yml', '.github/actions/setup/action.yml') }}-

      - name: Build validated application
        env:
          SKIP_DB: "true"
        run: npm run build:validated

      - name: Check security headers
        env:
          SKIP_DB: "true"
        run: |
          npm run start:ci &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT
          npm run wait:ci
          npm run security-headers:check -- http://127.0.0.1:4010/api/health

      # Playwright, image checks, and SEO checks stay optional for now;
      # keep the baseline guardrail workflow focused on stable PR blockers.

  # Preserve the existing coverage status context without rerunning Jest.
  # always() makes prerequisite failures fail this check instead of skipping it.
  coverage:
    name: coverage
    needs: guardrails
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require canonical validation success
        env:
          VALIDATION_RESULT: ${{ needs.guardrails.result }}
        run: test "$VALIDATION_RESULT" = success
