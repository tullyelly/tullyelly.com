name: "Setup Node and install deps"
description: "Install Node.js 22.20.0 and project dependencies"
inputs: {}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22.20.0"
        cache: "npm"
        cache-dependency-path: package-lock.json
    - name: Cache ESLint cache
      uses: actions/cache@v4
      with:
        path: .cache/eslint
        key: eslint-v2-${{ runner.os }}-${{ runner.arch }}-node22.20.0-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.*', 'eslint-rules/**', 'tsconfig.json') }}-${{ github.sha }}
        restore-keys: |
          eslint-v2-${{ runner.os }}-${{ runner.arch }}-node22.20.0-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.*', 'eslint-rules/**', 'tsconfig.json') }}-
    - name: Install dependencies
      shell: bash
      env:
        npm_config_platform: linux
        npm_config_arch: x64
        SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      run: npm ci --include=optional
